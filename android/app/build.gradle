plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.horatius.tapmap'
    compileSdk 36

    defaultConfig {
        applicationId 'com.horatius.tapmap'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"

        pip {
            install("-r", "requirements-android.txt")
        }
    }

    sourceSets {
        main {
            srcDir("../../src")
        }
    }
}

dependencies {
}
